name: Credential check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  credential-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check public output without printing sensitive matches
        run: node .github/scripts/check-secrets.mjs
